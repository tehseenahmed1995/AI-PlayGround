name: Deploy to ECS

# DISABLED BY DEFAULT: ci-cd.yml is the active deploy path (single EC2 instance).
# This ECS pipeline only runs when triggered manually from the Actions tab, so a
# push to main never triggers both workflows. To make ECS your primary path:
#   1. provision the AWS infra in DEPLOY_ECS.md and set its GitHub secrets,
#   2. replace the `workflow_dispatch` trigger below with the push/pull_request one
#      documented in DEPLOY_ECS.md, and
#   3. disable or delete ci-cd.yml.
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ai-playground
  ECS_CLUSTER: ai-playground
  ECS_SERVICE: ai-playground-svc
  ECS_TASK_FAMILY: ai-playground

jobs:
  # ---------- Job 1: test ----------
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ai_playground_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, zip, gd, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ai_playground_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ai_playground_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
        run: php artisan test

  # ---------- Job 2: build image, push to ECR, roll out ECS ----------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Runs on manual dispatch (the only trigger while this workflow is the
    # non-default path). If you switch `on:` back to push/pull_request, restore:
    #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    if: github.event_name == 'workflow_dispatch'

    # OIDC: exchange a short-lived token for an AWS role (no static keys in the repo)
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY
          docker build -f docker/ecs/Dockerfile -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # Apply DB migrations as a one-off task so a bad migration can't crash-loop the service
      - name: Run migrations (one-off task)
        run: |
          aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition $ECS_TASK_FAMILY \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_SUBNET }}],securityGroups=[${{ secrets.ECS_SG }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"app","command":["php","artisan","migrate","--force"]}]}'

      # Roll out the new image (zero-downtime rolling deploy behind the ALB)
      - name: Deploy new task revision
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment
