services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aipg-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ai_playground
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - aipg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:alpine
    container_name: aipg-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  aipg_pgdata:
