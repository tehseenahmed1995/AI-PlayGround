services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: ai-playground-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - postgres
      - redis
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=ai_playground
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    networks:
      - ai-playground

  nginx:
    image: nginx:alpine
    container_name: ai-playground-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ai-playground

  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-playground-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_playground
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ai-playground

  redis:
    image: redis:alpine
    container_name: ai-playground-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - ai-playground

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: ai-playground-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=ai_playground
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    networks:
      - ai-playground

  node:
    image: node:22-alpine
    container_name: ai-playground-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run build"
    networks:
      - ai-playground

volumes:
  pgdata:
  redisdata:

networks:
  ai-playground:
    driver: bridge
